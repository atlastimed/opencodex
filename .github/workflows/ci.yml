name: C248 timezone evidence only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c248-timezone-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  timezone-proof:
    name: focused timezone / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout evidence script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          path: evidence
      - name: Checkout immutable candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ce71d917143ddcbd5675b6ba92d8b1053971cd25
          path: candidate
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Frozen fixture dependencies
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
      - name: Prove timezone isolation and negative controls
        shell: bash
        run: python evidence/scripts/c248-timezone-proof.py candidate ce71d917143ddcbd5675b6ba92d8b1053971cd25
